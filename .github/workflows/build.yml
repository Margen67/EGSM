name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 (chromium)
            gmcommon_ref: master
            premake_args: --chromium=1
            platform: x64
            artifact: gmsv_egsm_chromium_win64

    steps:
      - name: Checkout EGSM
        uses: actions/checkout@main
        with:
          path: egsm

      - name: Checkout garrysmod_common (${{ matrix.gmcommon_ref }})
        uses: actions/checkout@main
        with:
          repository: danielga/garrysmod_common
          ref: ${{ matrix.gmcommon_ref }}
          submodules: recursive
          path: garrysmod_common

      - name: Install premake5
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0/premake-5.0.0-windows.zip" -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath "${env:RUNNER_TEMP}\premake"
          "${env:RUNNER_TEMP}\premake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate project files
        working-directory: egsm
        run: premake5 vs2026 --gmcommon="${env:GITHUB_WORKSPACE}\garrysmod_common" ${{ matrix.premake_args }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@main

      - name: Build
        working-directory: egsm
        run: |
          $sln = Get-ChildItem -Path projects -Recurse -Include *.slnx,*.sln | Select-Object -First 1
          if (-not $sln) { throw "premake did not generate a solution" }
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Collect DLL
        working-directory: egsm
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path projects -Filter *.dll -Recurse |
            Where-Object { $_.FullName -match "release" } |
            ForEach-Object { Copy-Item $_.FullName dist }
          if (-not (Get-ChildItem dist -Filter *.dll)) { throw "no DLL was produced" }

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.artifact }}
          path: egsm/dist/*.dll
          if-no-files-found: error
