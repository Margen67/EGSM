name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: x86-64 (chromium, ${{ matrix.vsver }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsver: vs2022
            runs-on: windows-2022
          - vsver: vs2026
            runs-on: windows-latest

    steps:
      - name: Checkout EGSM
        uses: actions/checkout@main
        with:
          path: egsm

      - name: Checkout garrysmod_common
        uses: actions/checkout@main
        with:
          repository: danielga/garrysmod_common
          ref: x86-64-support-sourcesdk
          submodules: recursive
          path: garrysmod_common

      - name: Install premake5
        run: |-
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0/premake-5.0.0-windows.zip" -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath "${env:RUNNER_TEMP}\premake"
          "${env:RUNNER_TEMP}\premake" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate project files
        working-directory: egsm
        run: premake5 ${{ matrix.vsver }} --gmcommon="${env:GITHUB_WORKSPACE}\garrysmod_common" --chromium=1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@main

      - name: Build
        working-directory: egsm
        run: |-
          $sln = Get-ChildItem -Path projects -Recurse -Include *.slnx,*.sln | Select-Object -First 1
          if (-not $sln) { throw "premake did not generate a solution" }
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64

      - name: Collect DLL
        working-directory: egsm
        run: |-
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path projects -Filter *.dll -Recurse |
            Where-Object { $_.FullName -match "release" } |
            ForEach-Object { Copy-Item $_.FullName dist }
          if (-not (Get-ChildItem dist -Filter *.dll)) { throw "no DLL was produced" }

      - name: Show imports
        working-directory: egsm
        run: |-
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Get-ChildItem dist -Filter *.dll | ForEach-Object { & $dumpbin /nologo /imports $_.FullName }

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: gmsv_egsm_chromium_win64-${{ matrix.vsver }}
          path: egsm/dist/*.dll
          if-no-files-found: error
